[project]
name = "junior-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aerich>=0.9.2",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.135.1",
    "pydantic-settings>=2.13.1",
    "pydantic[email]>=2.12.5",
    "pyjwt[crypto]>=2.12.1",
    "python-multipart>=0.0.22",
    "redis>=7.3.0",
    "tomlkit>=0.14.0",
    "tortoise-orm>=0.25.4",
    "uvicorn>=0.42.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
]

[tool.aerich]
tortoise_orm = "src.core.config.TORTOISE_ORM"
location = "src/db/migrations"
src_folder = "./."
